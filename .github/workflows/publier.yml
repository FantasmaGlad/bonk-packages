name: publier

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  construire:
    name: construire
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      a_faire: ${{ steps.controle.outputs.a_faire }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Faut-il publier ?
        id: controle
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          derniere=$(gh release view --repo FantasmaGlad/Bonk --json tagName --jq '.tagName | ltrimstr("v")')
          publiee=$(curl -fsSL https://packages.bonk-os.app/version.txt || true)
          if [ "$EVENEMENT" != schedule ] || [ "$derniere" != "$publiee" ]; then a_faire=true; else a_faire=false; fi
          echo "a_faire=$a_faire" >> "$GITHUB_OUTPUT"
      - name: Outils
        if: steps.controle.outputs.a_faire == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev rpm createrepo-c gnupg zstd
      # Fork PRs lack the secret: a throwaway key is used and everything is still checked.
      - name: Clé de signature
        if: steps.controle.outputs.a_faire == 'true'
        env:
          CLE: ${{ github.event_name != 'pull_request' && secrets.GPG_PRIVATE_KEY || '' }}
          EMPREINTE: ${{ vars.GPG_KEY_ID }}
        run: |
          if [ -z "$CLE" ]; then
            gpg --batch --passphrase '' --quick-generate-key "Essai <essai@invalid>" rsa2048 sign 1d
            EMPREINTE=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          else
            printf '%s' "$CLE" | gpg --batch --import
          fi
          echo "GPG_KEY_ID=$EMPREINTE" >> "$GITHUB_ENV"
      - if: steps.controle.outputs.a_faire == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - if: steps.controle.outputs.a_faire == 'true'
        run: corepack enable
      - name: Site
        if: steps.controle.outputs.a_faire == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
      - name: Construire les dépôts
        if: steps.controle.outputs.a_faire == 'true'
        run: bash scripts/construire.sh
      # Install from the built tree before publishing: a broken repository never reaches the public address.
      - name: Installer avant de publier
        if: steps.controle.outputs.a_faire == 'true'
        run: |
          essai=$(mktemp -d)
          cp -r site/. "$essai"
          gpg --export "$GPG_KEY_ID" > "$essai/bonk.gpg"
          gpg --armor --export "$GPG_KEY_ID" > "$essai/bonk.asc"
          python3 -m http.server --bind 127.0.0.1 --directory "$essai" 8080 > /dev/null 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          for image in debian:13 ubuntu:24.04 fedora:latest opensuse/tumbleweed:latest archlinux:latest termux/termux-docker:x86_64; do
            echo "::group::$image"
            # Inline: the Termux image switches user and drops the container's environment.
            docker run --rm --network host --volume "$PWD/scripts:/s:ro" "$image" \
              sh -c "BONK_DEPOT=http://127.0.0.1:8080 BONK_EMPREINTE=$GPG_KEY_ID sh /s/essai-installation.sh"
            echo "::endgroup::"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.controle.outputs.a_faire == 'true'
        with:
          path: site
          include-hidden-files: true

  publication:
    name: publication
    if: github.event_name != 'pull_request' && needs.construire.outputs.a_faire == 'true'
    needs: construire
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  menage:
    name: menage
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Garder les trois derniers déploiements
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' \
            | tail -n +4 \
            | while read -r id; do
                gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive > /dev/null
                gh api -X DELETE "repos/$GH_REPO/deployments/$id"
              done

  installer:
    name: installer (${{ matrix.image }})
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:24.04", "fedora:latest", "opensuse/tumbleweed:latest", "archlinux:latest", "termux/termux-docker:x86_64"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer depuis l'adresse publique
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm --volume "$PWD/scripts:/s:ro" "$IMAGE" sh /s/essai-installation.sh

  # The scripts of this tree, as a user runs them: a new terminal must find bonk.
  scripts:
    name: script (${{ matrix.nom }})
    needs: construire
    if: needs.construire.outputs.a_faire == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: crostini, os: ubuntu-24.04, image: "debian:13", coquille: bash }
          - { nom: alpine, os: ubuntu-24.04, image: "alpine:3", coquille: sh }
          - { nom: macos, os: macos-latest, coquille: zsh }
          - { nom: windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux, dans un conteneur
        if: matrix.image
        env:
          IMAGE: ${{ matrix.image }}
          COQUILLE: ${{ matrix.coquille }}
        run: docker run --rm --volume "$PWD:/d:ro" "$IMAGE" sh /d/scripts/essai-script.sh "$COQUILLE" /d/public/install.sh
      - name: macOS
        if: runner.os == 'macOS'
        run: sh scripts/essai-script.sh zsh public/install.sh
      - name: Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-Expression (Get-Content -Raw public\install.ps1)
          $dossier = "$env:LOCALAPPDATA\Programs\Bonk"
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dossier) { throw 'bonk absent du PATH de l''utilisateur' }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          (Get-Command bonk).Source
          bonk --version

  # Each provenance tool on each system, with a substituted archive and a modified SHA256SUMS.
  verification:
    name: verification (${{ matrix.nom }})
    needs: construire
    if: needs.construire.outputs.a_faire == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: linux-gh, os: ubuntu-24.04, outil: gh }
          - { nom: linux-cosign, os: ubuntu-24.04, outil: cosign }
          - { nom: macos-gh, os: macos-latest, outil: gh }
          - { nom: macos-cosign, os: macos-latest, outil: cosign }
          - { nom: windows-gh, os: windows-2025, outil: gh }
          - { nom: windows-cosign, os: windows-2025, outil: cosign }
    env:
      GH_TOKEN: ${{ matrix.outil == 'gh' && github.token || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.outil == 'cosign'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: gpg, macOS
        if: runner.os == 'macOS'
        run: command -v gpg || brew install gnupg
      - name: gpg, Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gnupg --no-progress -y
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\GnuPG\bin"
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh scripts/essai-verification.sh public/install.sh
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/essai-verification.ps1 public/install.ps1

  installer-windows:
    name: installer (windows)
    needs: publication
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop install https://packages.bonk-os.app/scoop/bonk.json
          bonk --version
          scoop uninstall bonk
          scoop install https://packages.bonk-os.app/scoop/bonk-cli.json
          bonk --version
